services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    # Install deps (idempotent) then start the live-reload dev server bound to
    # all interfaces so the preview's external hostname can reach it.
    command: sh -c "npm install && npx next dev -p 3000 -H 0.0.0.0"
    environment:
      # Lets next.config.ts derive the allowed dev origin for the preview host.
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      # Repo-local placeholders so the app boots before real secrets arrive.
      - ./.env.base44-defaults
      # Platform-delivered external secrets (Supabase keys). LAST = always wins.
      - /run/base44/app.env
    volumes:
      - .:/app
      # Keep installed deps & build cache out of the bind mount (host/container mismatch).
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
